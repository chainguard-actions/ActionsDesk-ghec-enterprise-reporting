name: Test custom issue title input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: test-owner/test-repo
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          enterprise_slug: my-enterprise
          enterprise_token: fake-enterprise-token
          github_token: fake-github-token
          issue_title: "Monthly GHEC Billing Summary"

      - name: Assert action ran with custom title and failed due to API error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because of invalid credentials (API error),
          # not because of an issue parsing the custom issue_title input.
          # A 'failure' outcome means the action ran and hit an API error — expected.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected outcome 'failure' (API auth error), got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action accepted custom issue_title and failed as expected with invalid credentials"
