name: Test default issue title input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          enterprise_slug: my-enterprise
          enterprise_token: fake-enterprise-token-for-testing
          github_token: ${{ github.token }}
          # issue_title is intentionally omitted to test the default value of "GHEC Usage Report"

      - name: Assert action failed at API stage not at input stage
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the enterprise token is invalid
          # (API authentication failure), not because of a missing issue_title.
          # This confirms the default value "GHEC Usage Report" is applied correctly.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid enterprise token, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action used default issue_title and failed at API stage as expected"
