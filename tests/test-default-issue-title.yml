name: Test default issue title input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action without specifying issue_title to test the default value.
      # The action will fail at the API call stage (invalid enterprise credentials),
      # but it should NOT fail due to a missing required input.
      - id: action
        uses: .
        continue-on-error: true
        with:
          enterprise_slug: test-enterprise-slug
          enterprise_token: fake-enterprise-token-for-testing
          github_token: ${{ github.token }}
          # issue_title intentionally omitted to test default: "GHEC Usage Report"

      # The action should fail due to API authentication error, not missing input.
      # If it failed due to missing required input, that would be a different error.
      - name: Assert action failed at API stage (not missing input stage)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed at API stage (default issue_title was accepted)"
