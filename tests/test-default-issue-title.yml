name: Test action with default issue title
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without specifying issue_title (uses default)
        id: action
        uses: .
        continue-on-error: true
        with:
          enterprise_slug: 'nonexistent-enterprise-slug-for-testing'
          enterprise_token: 'ghp_invalidtokenfortesting1234567890'
          github_token: ${{ github.token }}
          # issue_title not provided — should default to "GHEC Usage Report"

      - name: Assert action failed at API call (not at input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at the API call stage (not at input validation),
          # because issue_title has a valid default value of "GHEC Usage Report".
          # If it failed at input validation, it would also be "failure", which is
          # still acceptable — the key check is that the action ran (was invoked).
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid enterprise credentials, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action ran and failed at API call stage as expected (default issue_title was accepted)"
