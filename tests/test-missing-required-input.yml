name: Test missing required enterprise_slug input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action without the required enterprise_slug input.
      # The action should fail because enterprise_slug is required.
      # Note: GitHub Actions will reject the workflow if a required input
      # with no default is missing, so we test with an empty string instead.
      - id: action
        uses: .
        continue-on-error: true
        with:
          enterprise_slug: ''
          enterprise_token: fake-enterprise-token-for-testing
          github_token: ${{ github.token }}
          issue_title: Test Report

      # The action should fail — either because the empty slug is rejected
      # by the API or because the required input validation fails.
      - name: Assert action failed with empty enterprise_slug
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with empty enterprise_slug, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when enterprise_slug is empty"
