name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          enterprise_slug: test-enterprise
          enterprise_token: ${{ github.token }}
          github_token: ${{ github.token }}
          issue_title: GHEC Usage Report

      - name: Assert action ran and failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly (real enterprise access?)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected — sentinel repo and no real enterprise slug)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
