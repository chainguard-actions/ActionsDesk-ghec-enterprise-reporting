name: Test basic invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    # The action will fail because the tokens are fake, but we want to verify
    # it starts up and fails with an authentication/API error (not a setup error)
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          enterprise_slug: test-enterprise
          enterprise_token: fake-enterprise-token
          github_token: fake-github-token
          issue_title: Test GHEC Usage Report
      - name: Assert action ran (outcome is failure due to invalid credentials, not setup error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should have run and failed (not skipped or errored at setup)
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME, expected failure due to fake credentials)"
