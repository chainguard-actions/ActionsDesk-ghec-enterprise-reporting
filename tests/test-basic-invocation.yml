name: Test basic invocation with invalid credentials
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          enterprise_slug: test-enterprise-slug
          enterprise_token: fake-enterprise-token-for-testing
          github_token: ${{ github.token }}
          issue_title: GHEC Usage Report

      - name: Assert action failed due to API error (not input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the enterprise token is invalid
          # and the GraphQL API call will be rejected — not because of missing inputs
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid enterprise token, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action failed as expected with invalid enterprise credentials"
