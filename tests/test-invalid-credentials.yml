name: Test invalid enterprise credentials
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid enterprise credentials
        id: action
        uses: .
        with:
          enterprise_slug: test-enterprise-slug
          enterprise_token: invalid-token-for-testing
          github_token: ${{ github.token }}
          issue_title: GHEC Usage Report
        continue-on-error: true

      - name: Assert action failed due to API error (not missing input)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because of invalid enterprise credentials,
          # not because of missing required inputs. A 'failure' outcome is expected.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with invalid credentials"
          else
            echo "FAIL: expected action to fail with invalid credentials, got: $OUTCOME"
            exit 1
          fi
