name: Test invalid enterprise credentials
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action with invalid enterprise credentials.
      # It should fail because the enterprise_token is not valid,
      # NOT because of missing inputs or configuration errors.
      - id: action
        uses: .
        continue-on-error: true
        with:
          enterprise_slug: test-enterprise-slug
          enterprise_token: fake-enterprise-token-for-testing
          github_token: ${{ github.token }}
          issue_title: GHEC Usage Report

      # The action should have failed (outcome == 'failure') because the
      # enterprise_token is invalid and the GitHub API will reject it.
      - name: Assert action failed due to API error (not config error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when given invalid enterprise credentials"
