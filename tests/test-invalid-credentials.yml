name: Test action with invalid enterprise credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid enterprise credentials (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          enterprise_slug: 'nonexistent-enterprise-slug-for-testing'
          enterprise_token: 'ghp_invalidtokenfortesting1234567890'
          github_token: ${{ github.token }}
          issue_title: 'GHEC Usage Report'

      - name: Assert action failed due to invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid enterprise credentials, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid enterprise credentials"
