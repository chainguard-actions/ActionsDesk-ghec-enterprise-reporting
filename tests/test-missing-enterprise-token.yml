name: Test missing enterprise_token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without enterprise_token (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          enterprise_slug: 'my-enterprise'
          enterprise_token: ''
          github_token: ${{ github.token }}
          issue_title: 'Test Report'

      - name: Assert action failed due to missing required input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when enterprise_token is empty, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when enterprise_token is empty"
