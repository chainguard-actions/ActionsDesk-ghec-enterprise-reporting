name: Test default issue title
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          enterprise_slug: test-enterprise
          enterprise_token: fake-enterprise-token
          github_token: fake-github-token
          # issue_title intentionally omitted to test default value of "GHEC Usage Report"
      - name: Assert action ran with default title (fails due to fake credentials, not missing input)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should have run and failed due to invalid credentials,
          # not due to a missing required input (issue_title has a default)
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran without explicit issue_title (outcome=$OUTCOME)"
