name: Test default issue title
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          enterprise_slug: my-enterprise
          enterprise_token: fake-enterprise-token
          github_token: fake-github-token
          # issue_title is intentionally omitted to use the default "GHEC Usage Report"
      - name: Assert action ran with default title (failed due to invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fake credentials the action should fail at the API call stage,
          # not at input parsing. Either 'failure' (API error) or 'success' is acceptable.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action ran with default issue_title"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' — action may have crashed before running"
            exit 1
          fi
